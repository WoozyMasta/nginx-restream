worker_processes 1;
pid /tmp/nginx.pid;

error_log /dev/stderr info;

events {
	worker_connections 512;
}

rtmp {
	server {
		listen 1935;
		chunk_size 4096;
		max_connections 8;

		ping 30s;
		ping_timeout 10s;

		include access.conf;

		application live {
			live on;
			record off;
			meta copy;

			push_reconnect 3s;

			dynamic_push_required off;
			dynamic_push_strict off;
			dynamic_push_key_max_len 512;

			# Pass stream keys as RTMP query args:
			#   rtmp://server:1935/live/stream?yt=KEY&tw=KEY&vk=KEY
			#
			# Direct push — no transcoding, stream must already
			# be compatible with the target platform bitrate/resolution
			dynamic_push_arg yt rtmp://a.rtmp.youtube.com/live2;

			# Conditional transcoding — ffmpeg spawns only when the
			# matching arg is present in the publish URL.
			# Each destination gets its own process and its own parameters.
			# $value contains the stream key passed by the client.

			dynamic_exec_arg tw /bin/ffmpeg
				-loglevel warning
				-i rtmp://127.0.0.1:1935/live/$name
				-c:v libx264 -preset veryfast
				-b:v 5500k -maxrate 5500k -bufsize 11000k
				-vf scale=1920:1080
				-r 60
				-c:a aac -b:a 160k -ar 48000
				-f flv rtmp://live.twitch.tv/app/$value;

			dynamic_exec_arg vk /bin/ffmpeg
				-loglevel warning
				-i rtmp://127.0.0.1:1935/live/$name
				-c:v libx264 -preset veryfast
				-b:v 4000k -maxrate 4000k -bufsize 8000k
				-vf scale=1280:720
				-r 30
				-c:a aac -b:a 128k -ar 48000
				-f flv rtmp://ovsu.mycdn.me/input/$value;

			dynamic_exec_arg tr /bin/ffmpeg
				-loglevel warning
				-i rtmp://127.0.0.1:1935/live/$name
				-c:v libx264 -preset veryfast
				-b:v 5000k -maxrate 5000k -bufsize 10000k
				-vf scale=1920:1080
				-r 60
				-c:a aac -b:a 160k -ar 48000
				-f flv rtmp://livepush.trovo.live/live/$value;
		}
	}
}

include stats.conf;
